<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Llama Music</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: #08060F; color: #F4F5FF;
      font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    main { max-width: 560px; padding: 32px 20px; text-align: center; }
    h1 {
      font-size: 2.6rem; margin: 0 0 8px;
      background: linear-gradient(90deg, #4D7CFF, #7C5CFF, #B45CFF);
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    p { color: #B0B5D6; }
    .btn {
      display: inline-block; margin: 8px 6px; padding: 12px 22px;
      border-radius: 999px; text-decoration: none; font-weight: 600;
    }
    .primary { background: linear-gradient(90deg, #7C5CFF, #4D7CFF); color: #fff; }
    .ghost { border: 1px solid #1E1B3D; color: #F4F5FF; }
    footer { margin-top: 32px; font-size: .85rem; color: #6E7399; }
  </style>
</head>
<body>
  <main>
    <h1>Llama Music</h1>
    <p>Tu música del teléfono y de YouTube en una sola app, con un DJ con
      inteligencia artificial que arma y corrige tus playlists conversando.</p>
    <a class="btn primary" href="https://github.com/DiegoVidarte20/llama-music-releases/releases/latest">
      Descargar para Android</a>
    <a class="btn ghost" href="privacy.html">Política de privacidad</a>
    <footer>Llama Music · Proyecto personal</footer>
  </main>
</body>
</html>
